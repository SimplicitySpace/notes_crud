[package]
name = "notes-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive", ] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
sqlx  = { version = "0.9", features = ["runtime-tokio", "tls-native-tls", "sqlite", "uuid"] }
dotenvy = "0.15.7"
uuid  = { version = "1.29.2", features = ["v7", "serde"] }
